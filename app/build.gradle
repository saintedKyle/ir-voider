plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kylem.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.kylem.remote"
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
